<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- 三层同心圆环：节拍脉冲由内向外扩散
       全部用不透明纯白，粗细由内向外递减来表达层次（不用 opacity，否则叠在桌面壁纸上会透底变灰） -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <circle cx="116" cy="112" r="18" stroke-width="13"/>
    <circle cx="116" cy="112" r="43" stroke-width="10"/>
    <circle cx="116" cy="112" r="68" stroke-width="7"/>
  </g>

  <!-- 单一速度箭头：表达"推向目标速度" -->
  <path d="M182 88 L214 112 L182 136 Z" fill="#fff"/>

  <!-- 底部三拍点：强-弱-弱（靠尺寸递减区分强弱，同样不用 opacity） -->
  <g fill="#fff">
    <circle cx="76"  cy="202" r="12"/>
    <circle cx="116" cy="202" r="8"/>
    <circle cx="152" cy="202" r="5.5"/>
  </g>
</svg>
