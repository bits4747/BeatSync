[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beatsync"
version = "1.2.10"
description = "鎶婇煶涔愬彉閫熷埌鐩爣 BPM锛屽苟鍙犲姞绮剧‘瀵归綈鐨勮妭鎷嶅櫒"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BeatSync contributors" }]
keywords = ["tempo", "bpm", "metronome", "audio", "librosa", "time-stretch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Intended Audience :: End Users/Desktop",
]

# 杩愯鏈熶緷璧栵細鍙啓涓嬮檺锛屼笌 requirements.txt 淇濇寔鍚屼竴鍙ｅ緞锛堣璇ユ枃浠惰鏄庯級
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# 妗岄潰鐗堢晫闈紙WebView锛夈€備笉瑁呬篃鑳界敤鍛戒护琛屼笌鍏煎鐣岄潰銆?gui = ["pywebview>=5.1"]
# 寮€鍙?娴嬭瘯
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/bits4747/BeatSync"
Issues = "https://github.com/bits4747/BeatSync/issues"

[project.scripts]
beatsync = "tempo_converter:main"

[tool.setuptools]
py-modules = ["tempo_converter", "tempo_converter_app", "tempo_converter_gui"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    # librosa / numba 鍦ㄩ儴鍒嗙増鏈笂浼氬埛鏃犲叧璀﹀憡锛屼笉搴斿綋璁╂祴璇曞彉绾?    "ignore::FutureWarning",
]
